# Paste this at https://api.slack.com/apps -> Create New App -> From a manifest
display_information:
  name: PolicyBot
  description: Answers company policy questions and names the relevant policy.
  background_color: "#1f5f8b"
features:
  bot_user:
    display_name: PolicyBot
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
settings:
  event_subscriptions:
    bot_events:
      - app_mention
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
